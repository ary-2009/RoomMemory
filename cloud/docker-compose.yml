name: roommemory
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - roommemory_pg:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Intentionally no public host port for PostgreSQL.

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/password_file:/mosquitto/config/password_file:ro
      - ./infra/mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "8883:8883"
    networks: [backend]
    # Port 1883 is intentionally private to the Docker network.

  api:
    build:
      context: ..
      dockerfile: cloud/services/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MQTT_URL: ${MQTT_URL:-mqtt://mosquitto:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks: [backend]
    # API is reached through Caddy only; no public host port.

  web:
    build:
      context: ..
      dockerfile: cloud/apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks: [backend]

volumes:
  roommemory_pg:
  mosquitto_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
