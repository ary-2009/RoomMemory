services:
  postgres:
    image: postgres:16-alpine
    container_name: roommemory-postgres-local
    environment:
      POSTGRES_DB: roommemory
      POSTGRES_USER: roommemory
      POSTGRES_PASSWORD: roommemory_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roommemory_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/001_sensor_alert_events.sql:/docker-entrypoint-initdb.d/002-sensor-alert-events.sql:ro
      - ./database/002_auth_and_ownership.sql:/docker-entrypoint-initdb.d/003-auth-and-ownership.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommemory -d roommemory"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: roommemory-mosquitto-local
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - roommemory_mqttdata:/mosquitto/data
    restart: unless-stopped

volumes:
  roommemory_pgdata:
  roommemory_mqttdata:
